name: CI
on:
  push:
    branches: [main]
  pull_request:

# Linux only on purpose: macOS runners are expensive.
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test with the measured probe
        run: ./build/memlayout examples/basic.cpp Sample -f table | grep "7 bytes of fields + 5 bytes of padding = 12 bytes"
