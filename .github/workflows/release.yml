name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

# Builds the Linux binary only. The macOS binary is attached from a developer
# Mac with scripts/release-macos.sh (macOS runners are expensive).
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DMEMLAYOUT_STATIC=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Check the tag matches the binary version
        run: |
          [ "v$(build/memlayout --version | awk '{print $2}')" = "${GITHUB_REF_NAME}" ] \
            || { echo "tag ${GITHUB_REF_NAME} != binary version; bump project(VERSION)"; exit 1; }
      - name: Package
        run: |
          strip build/memlayout
          tar -czf memlayout-linux-x86_64.tar.gz -C build memlayout
          sha256sum memlayout-linux-x86_64.tar.gz > memlayout-linux-x86_64.tar.gz.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" memlayout-linux-x86_64.tar.gz memlayout-linux-x86_64.tar.gz.sha256 install.sh --clobber
